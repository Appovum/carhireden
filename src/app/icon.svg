  <line x1="328" y1="320" x2="328" y2="340" stroke="#F7F5F0" stroke-width="16" stroke-linecap="round"/>
  <line x1="244" y1="256" x2="264" y2="256" stroke="#F7F5F0" stroke-width="16" stroke-linecap="round"/>
  <line x1="392" y1="256" x2="412" y2="256" stroke="#F7F5F0" stroke-width="16" stroke-linecap="round"/>
</svg>