  <rect x="72" y="128" width="368" height="256" rx="32" stroke="#F7F5F0" stroke-width="24" fill="none"/>
  
  <!-- Vertical Dashed Stub Tear Line -->
  <line x1="192" y1="144" x2="192" y2="368" stroke="#F7F5F0" stroke-width="20" stroke-linecap="round" stroke-dasharray="4 24"/>

